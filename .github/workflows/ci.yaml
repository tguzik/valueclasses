name: CI

on:
  workflow_dispatch:  # No additional yaml keys are necessary
  pull_request:  # No additional yaml keys are necessary
  push:
    branches:
      - "master"
      - "main"

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci-using-devenv:
    name: CI
    runs-on: ubuntu-slim
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # https://github.com/cachix/install-nix-action/releases/tag/v31.11.1
        with:
          nix_path: nixpkgs=channel:nixos-25.11

      - name: Print nixpkgs version
        run: |
          nix-instantiate --eval -E '(import <nixpkgs> {}).lib.version'

      - name: Install DevEnv
        env:
          LOCAL_DEVENV_REVISION: ea3d94ac9d6bf6a1313773170122ca4e2ef5a0be # https://github.com/cachix/devenv/releases/tag/v2.1.2
        run: |
          nix profile add "github:cachix/devenv/${LOCAL_DEVENV_REVISION}" --accept-flake-config --option extra-substituters "https://devenv.cachix.org?trusted=true&priority=3"

      - name: Run devenv test
        run: |
          devenv test

      - name: Build, run tests, run static analysis
        shell: devenv shell bash -- -e {0}
        run: |
          mvn clean verify

  check-supported-jdks:
    needs: ci-using-devenv
    strategy:
      max-parallel: 1 # Avoid concurrency settings cancelling matrix builds
      matrix:
        jdk_version: [ 17, 21, 25 ]

    name: "JDK ${{ matrix.jdk_version }}"
    runs-on: ubuntu-latest # ubuntu-slim doesn't come with maven by default, and we want to avoid installing it in the workflow
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          persist-credentials: false

      - name: "Set up JDK ${{ matrix.jdk_version }}"
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # https://github.com/actions/setup-java/releases/tag/v5.7.0
        with:
          distribution: "temurin"
          java-version: ${{ matrix.jdk_version }}
          cache: "maven"
          cache-dependency-path: |
            **/pom.xml

      - name: Build, run tests, run static analysis
        shell: bash
        run: |
          mvn clean verify

# eof
